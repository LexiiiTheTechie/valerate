# ==============================================================================
# COTURN TURN/STUN SERVER CONFIGURATION - AIR-GAPPED LAN WEBRTC
# ==============================================================================

# Listening interfaces and ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Dynamic relay port range (for WebRTC streams)
min-port=49152
max-port=49172

# Security & Protocol hardening
no-cli
no-tlsv1
no-tlsv1.1
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=${TURN_SHARED_SECRET}
realm=${LAN_IP}

# TLS certificates
cert=/certs/server.crt
pkey=/certs/server.key

# Logging & Performance
verbose
log-file=stdout
no-multicast-peers
no-software-attribute
