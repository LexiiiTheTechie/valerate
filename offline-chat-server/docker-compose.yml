services:
  postgres:
    image: postgres:15-alpine
    container_name: offline_chat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      POSTGRES_USER: ${POSTGRES_USER:-synapse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      offline_net:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse_user} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: offline_chat_synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.runtime.yaml
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./config/synapse/homeserver.runtime.yaml:/data/homeserver.runtime.yaml:ro
      - synapse_data:/data
    networks:
      offline_net:
        ipv4_address: 172.28.0.3

  coturn:
    image: coturn/coturn:latest
    container_name: offline_chat_coturn
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # STUN / TURN standard ports
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      # TURN relay media stream ports
      - "49152-49172:49152-49172/udp"
    volumes:
      - ./config/coturn/turnserver.conf:/etc/turnserver.conf:ro
      - ./certs:/certs:ro
    command:
      - "-c"
      - "/etc/turnserver.conf"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET must be set in .env}"
      - "--realm=${LAN_IP}"
    networks:
      offline_net:
        ipv4_address: 172.28.0.4

  nginx:
    image: nginx:alpine
    container_name: offline_chat_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./client/dist:/usr/share/nginx/html:ro
    depends_on:
      - synapse
    networks:
      offline_net:
        ipv4_address: 172.28.0.5

networks:
  offline_net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
    name: offline_chat_postgres_data
  synapse_data:
    name: offline_chat_synapse_data
